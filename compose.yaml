name: contabilidade

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contabilidade}
      POSTGRES_USER: ${POSTGRES_USER:-contabilidade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./dados/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contabilidade} -d ${POSTGRES_DB:-contabilidade}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [contabilidade]

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
      - --http-relative-path=/auth
      - --proxy-headers=xforwarded
      - --hostname-strict=false
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-contabilidade}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Defina KEYCLOAK_ADMIN_PASSWORD no arquivo .env}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak/${KEYCLOAK_REALM_FILE:-realm-contabilidade-dev.json}:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [contabilidade]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-contabilidade}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-contabilidade}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      APP_SECURITY_ENABLED: ${APP_SECURITY_ENABLED:-true}
      JWT_ISSUER_URI: ${PUBLIC_BASE_URL:-http://localhost:8088}/auth/realms/contabilidade
      JWT_JWK_SET_URI: http://keycloak:8080/auth/realms/contabilidade/protocol/openid-connect/certs
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8088,http://localhost:5173}
      APP_STORAGE_LOCAL_PATH: ${APP_STORAGE_LOCAL_PATH:-/data/documentos}
      APP_WORKER_TOKEN: ${APP_WORKER_TOKEN:?Defina APP_WORKER_TOKEN no arquivo .env}
      APP_ENVIRONMENT: ON_PREMISE
    volumes:
      - ./dados/documentos:/data/documentos
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [contabilidade]

  automation-worker:
    build:
      context: ./automation-worker
    restart: unless-stopped
    init: true
    ipc: host
    security_opt:
      - seccomp=./infra/playwright/seccomp_profile.json
    environment:
      WORKER_PORT: 3001
      BACKEND_URL: http://backend:8080
      WORKER_TOKEN: ${APP_WORKER_TOKEN:?Defina APP_WORKER_TOKEN no arquivo .env}
      BROWSER_HEADLESS: "true"
      POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-180}
    shm_size: 1gb
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [contabilidade]

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      APP_API_BASE_URL: /api
      APP_AUTH_ENABLED: ${APP_SECURITY_ENABLED:-true}
      APP_KEYCLOAK_URL: /auth
      APP_KEYCLOAK_REALM: contabilidade
      APP_KEYCLOAK_CLIENT_ID: contabilidade-frontend
    ports:
      - "${APP_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [contabilidade]

networks:
  contabilidade:

volumes:
  postgres_data:
