name: Startup Action Contracts

on:
  pull_request:
    branches: [main]
    paths:
      - "START_CONTABILIDADE.bat"
      - "frontend/Dockerfile"
      - "frontend/nginx.conf"
      - "frontend/docker-entrypoint.d/40-runtime-config.sh"
      - "frontend/scripts/test-runtime-nginx-auth.sh"
      - "scripts/start-contabilidade-core.bat"
      - "scripts/start-contabilidade-resilient.ps1"
      - "scripts/start-compose-sequential.*"
      - "scripts/invoke-startup-runtime-preflight.ps1"
      - "scripts/verify-runtime-images.ps1"
      - "scripts/check-contabilidade.ps1"
      - "scripts/doctor-contabilidade.ps1"
      - "scripts/verify-backup.ps1"
      - "scripts/lib/**"
      - "scripts/tests/**"
      - "scripts/codex/validate-startup-actions*"
      - ".github/workflows/startup-actions.yml"
  push:
    branches: [main]
    paths:
      - "START_CONTABILIDADE.bat"
      - "frontend/Dockerfile"
      - "frontend/nginx.conf"
      - "frontend/docker-entrypoint.d/40-runtime-config.sh"
      - "frontend/scripts/test-runtime-nginx-auth.sh"
      - "scripts/start-contabilidade-core.bat"
      - "scripts/start-contabilidade-resilient.ps1"
      - "scripts/start-compose-sequential.*"
      - "scripts/invoke-startup-runtime-preflight.ps1"
      - "scripts/verify-runtime-images.ps1"
      - "scripts/check-contabilidade.ps1"
      - "scripts/doctor-contabilidade.ps1"
      - "scripts/verify-backup.ps1"
      - "scripts/lib/**"
      - "scripts/tests/**"
      - "scripts/codex/validate-startup-actions*"
      - ".github/workflows/startup-actions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate action boundaries
        run: node scripts/codex/validate-startup-actions.mjs
      - name: Test action regressions
        run: node --test scripts/codex/validate-startup-actions.test.mjs
      - name: Validate frontend Nginx auth-mode rendering
        shell: bash
        run: bash frontend/scripts/test-runtime-nginx-auth.sh
      - name: Parse every operational PowerShell file with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @(Get-ChildItem -LiteralPath 'scripts' -Recurse -File |
            Where-Object { $_.Extension -in @('.ps1', '.psm1') } |
            Sort-Object FullName)
          $failureCount = 0
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$errors
            )
            foreach ($parseError in $errors) {
              $failureCount++
              Write-Host ("[ERROR] {0}:{1}:{2} {3}" -f
                $file.FullName,
                $parseError.Extent.StartLineNumber,
                $parseError.Extent.StartColumnNumber,
                $parseError.Message) -ForegroundColor Red
            }
          }
          if ($failureCount -gt 0) {
            throw "PowerShell parser encontrou $failureCount erro(s)."
          }
          Write-Host "PowerShell parser: $($files.Count) arquivo(s) validado(s)."
      - name: Validate module exports, import order and project command references
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/assert-startup-powershell-contract.ps1
      - name: Validate PRIMA-style read-only preflight and Docker inspect argument transport
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/assert-prima-startup-contract.ps1
      - name: Validate binder-safe runtime image verification and post-start Nginx authority
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/assert-runtime-image-verification-contract.ps1
