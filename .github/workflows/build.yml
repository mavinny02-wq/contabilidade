name: Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar e testar backend
        working-directory: backend
        run: mvn -B clean verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validar contratos dos scripts Docker
        run: node scripts/codex/validate-docker-orchestration.mjs
      - name: Validar sintaxe PowerShell operacional
        shell: pwsh
        run: |
          $files = @(
            'scripts/start-contabilidade-resilient.ps1',
            'scripts/start-compose-sequential.ps1',
            'scripts/deploy-contabilidade-onpremise.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              throw "Sintaxe PowerShell invalida em $file"
            }
          }
      - name: Instalar frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Validar i18n
        working-directory: frontend
        run: npm run locale:validate
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Testes
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  automation-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: automation-worker/package-lock.json
      - name: Instalar
        working-directory: automation-worker
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: automation-worker
        run: npm run typecheck
      - name: Testes
        working-directory: automation-worker
        run: npm test
      - name: Build
        working-directory: automation-worker
        run: npm run build
