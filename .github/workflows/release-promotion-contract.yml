name: Release promotion contract

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/release/promotion/**"
      - ".github/workflows/release-promotion-contract.yml"
      - "VERSION"
      - "backend/src/main/resources/db/migration/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate policy fixtures and deterministic outputs
        run: python -m unittest discover -s scripts/release/promotion/tests -p 'test_*.py'
