name: Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  migration-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validar registro de migrações
        run: node scripts/orchestration/validate-migration-registry.mjs
      - name: Testar guard de migrações
        run: node --test scripts/orchestration/tests/validate-migration-registry.test.mjs

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar backend sem testes
        working-directory: backend
        run: mvn -B -DskipTests compile

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validar scripts Docker
        run: node scripts/codex/validate-docker-orchestration.mjs
      - name: Testar regressões dos scripts Docker
        run: node --test scripts/codex/validate-docker-orchestration.test.mjs
      - name: Validar sintaxe PowerShell operacional
        shell: pwsh
        run: |
          $files = @(
            'scripts/start-contabilidade-resilient.ps1',
            'scripts/start-compose-sequential.ps1',
            'scripts/deploy-contabilidade-onpremise.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              throw "Sintaxe PowerShell invalida em $file"
            }
          }
      - name: Instalar
        working-directory: frontend
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Validar i18n
        working-directory: frontend
        run: npm run locale:validate
      - name: Build
        working-directory: frontend
        run: npm run build

  automation-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Instalar e compilar
        working-directory: automation-worker
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi && npm run build
