name: Startup Reliability

on:
  push:
    branches: [codex/bootstrap-deepseek-runner]
    paths:
      - compose.yaml
      - compose.dev.yaml
      - backend/**
      - frontend/**
      - automation-worker/**
      - infra/**
      - .github/workflows/startup-reliability.yml
  pull_request:
    branches: [main]
    paths:
      - START_CONTABILIDADE.bat
      - scripts/start-contabilidade-core.bat
      - scripts/start-contabilidade-resilient.ps1
      - scripts/start-compose-sequential.bat
      - scripts/start-compose-sequential.ps1
      - scripts/invoke-startup-runtime-preflight.ps1
      - scripts/verify-runtime-images.ps1
      - scripts/lib/contabilidade-docker.psm1
      - scripts/lib/startup-probe.psm1
      - scripts/lib/native-process.psm1
      - scripts/tests/**
      - scripts/codex/validate-docker-orchestration.mjs
      - scripts/codex/validate-docker-orchestration.test.mjs
      - .github/workflows/startup-reliability.yml
  workflow_dispatch:
    inputs:
      run_linux_runtime:
        description: Execute the Linux Docker Compose runtime twice on a GitHub-hosted runner
        required: false
        default: false
        type: boolean
      run_runtime:
        description: Execute Docker Desktop, Compose twice and the official BAT on a dedicated self-hosted Windows runner
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  linux-compose-runtime:
    name: Linux Docker Compose runtime twice
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_linux_runtime) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare bounded runtime environment
        shell: bash
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/contabilidade-runtime.env"
          cp .env.example "$env_file"
          echo "ENV_FILE=$env_file" >> "$GITHUB_ENV"
          docker version
          docker compose version
          docker compose --env-file "$env_file" -f compose.yaml -f compose.dev.yaml config --quiet
      - name: First startup and real health
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose --env-file "$ENV_FILE" -f compose.yaml -f compose.dev.yaml)
          "${compose[@]}" up -d --build --wait --wait-timeout 900
          pg_container_first="$("${compose[@]}" ps -q postgres)"
          test -n "$pg_container_first"
          pg_volume_first="$(docker inspect "$pg_container_first" --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}')"
          test -n "$pg_volume_first"
          echo "PG_CONTAINER_FIRST=$pg_container_first" >> "$GITHUB_ENV"
          echo "PG_VOLUME_FIRST=$pg_volume_first" >> "$GITHUB_ENV"
          for url in \
            http://127.0.0.1:8080/actuator/health/liveness \
            http://127.0.0.1:8080/actuator/health/readiness \
            http://127.0.0.1:3001/health \
            http://127.0.0.1:8088/healthz \
            http://127.0.0.1:8088/api/info; do
            curl --fail --silent --show-error "$url" >/dev/null
          done
          test "$("${compose[@]}" exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT version FROM flyway_schema_history WHERE success ORDER BY installed_rank DESC LIMIT 1"')" = "12"
          bootstrap_id="$("${compose[@]}" ps -aq postgres-bootstrap)"
          test -n "$bootstrap_id"
          test "$(docker inspect "$bootstrap_id" --format '{{.State.ExitCode}}')" = "0"
      - name: Second startup without cleanup and PostgreSQL reuse
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose --env-file "$ENV_FILE" -f compose.yaml -f compose.dev.yaml)
          "${compose[@]}" up -d --wait --wait-timeout 900
          pg_container_second="$("${compose[@]}" ps -q postgres)"
          pg_volume_second="$(docker inspect "$pg_container_second" --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}')"
          test "$pg_container_second" = "$PG_CONTAINER_FIRST"
          test "$pg_volume_second" = "$PG_VOLUME_FIRST"
          for url in \
            http://127.0.0.1:8080/actuator/health/liveness \
            http://127.0.0.1:8080/actuator/health/readiness \
            http://127.0.0.1:3001/health \
            http://127.0.0.1:8088/healthz \
            http://127.0.0.1:8088/api/info; do
            curl --fail --silent --show-error "$url" >/dev/null
          done
          test "$("${compose[@]}" exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT version FROM flyway_schema_history WHERE success ORDER BY installed_rank DESC LIMIT 1"')" = "12"
      - name: Bounded failure diagnostics
        if: failure()
        shell: bash
        run: |
          docker compose --env-file "$ENV_FILE" -f compose.yaml -f compose.dev.yaml ps --all || true

  windows-powershell51-contracts:
    name: Windows PowerShell 5.1 contracts
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.run_linux_runtime }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Pester 5
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Run parser, guards, native stderr and mocked lifecycle tests
        shell: powershell
        run: |
          .\scripts\tests\run-startup-reliability-gate.ps1

  windows-docker-desktop-runtime:
    name: Windows Docker Desktop runtime gate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_runtime }}
    runs-on: [self-hosted, Windows, X64, docker-desktop, contabilidade-startup]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Pester 5
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Run full startup reliability gate
        shell: powershell
        run: |
          .\scripts\tests\run-startup-reliability-gate.ps1 `
            -RunDockerIntegration `
            -RunComposeIntegration `
            -RunOfficialStartup
