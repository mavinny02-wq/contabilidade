name: contabilidade

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - "log_line_prefix=%m [%p] db=%d,user=%u,app=%a,client=%h "
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contabilidade}
      POSTGRES_USER: ${POSTGRES_USER:-contabilidade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./dados/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [contabilidade]

  postgres-bootstrap:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGAPPNAME: contabilidade-postgres-bootstrap
      PGPASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-contabilidade}
      POSTGRES_USER: ${POSTGRES_USER:-contabilidade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
    entrypoint: ["/bin/sh", "/bootstrap/01-create-keycloak-db.sh"]
    volumes:
      - ./infra/postgres/init/01-create-keycloak-db.sh:/bootstrap/01-create-keycloak-db.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [contabilidade]

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
      - --http-relative-path=/auth
      - --proxy-headers=xforwarded
      - --hostname-strict=false
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}?ApplicationName=keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-contabilidade}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Defina KEYCLOAK_ADMIN_PASSWORD no arquivo .env}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak/${KEYCLOAK_REALM_FILE:-realm-contabilidade-dev.json}:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000;
          printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          grep -q "HTTP/1.1 200" <&3'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    networks: [contabilidade]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-contabilidade}?ApplicationName=contabilidade-backend
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-contabilidade}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      APP_SECURITY_ENABLED: ${APP_SECURITY_ENABLED:-true}
      JWT_ISSUER_URI: ${PUBLIC_BASE_URL:-http://localhost:8088}/auth/realms/contabilidade
      JWT_JWK_SET_URI: http://keycloak:8080/auth/realms/contabilidade/protocol/openid-connect/certs
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8088,http://localhost:5173}
      APP_STORAGE_LOCAL_PATH: ${APP_STORAGE_LOCAL_PATH:-/data/documentos}
      APP_BACKUP_DIRECTORY: ${APP_BACKUP_DIRECTORY:-/data/backups}
      APP_BACKUP_INVENTORY_MAX_MANIFESTS: ${APP_BACKUP_INVENTORY_MAX_MANIFESTS:-50}
      APP_BACKUP_MANIFEST_MAX_SIZE_BYTES: ${APP_BACKUP_MANIFEST_MAX_SIZE_BYTES:-1048576}
      APP_BACKUP_HASH_MAX_COMPONENT_SIZE_BYTES: ${APP_BACKUP_HASH_MAX_COMPONENT_SIZE_BYTES:-53687091200}
      APP_WORKER_TOKEN: ${APP_WORKER_TOKEN:?Defina APP_WORKER_TOKEN no arquivo .env}
      APP_AUTOMATION_PUBLIC_PATH: ${APP_AUTOMATION_PUBLIC_PATH:-/automation}
      APP_AUTOMATION_SESSION_SIGNING_SECRET: ${APP_AUTOMATION_SESSION_SIGNING_SECRET:?Defina APP_AUTOMATION_SESSION_SIGNING_SECRET no arquivo .env}
      APP_AUTOMATION_SESSION_TICKET_TTL: ${APP_AUTOMATION_SESSION_TICKET_TTL:-PT15M}
      APP_ENVIRONMENT: ON_PREMISE
      APP_VERSION: 0.5.1
    volumes:
      - ./dados/documentos:/data/documentos
      - ./dados/backups:/data/backups:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks: [contabilidade]

  automation-worker:
    build:
      context: ./automation-worker
    restart: unless-stopped
    init: true
    ipc: host
    security_opt:
      - seccomp=./infra/playwright/seccomp_profile.json
    environment:
      WORKER_PORT: 3001
      BACKEND_URL: http://backend:8080
      WORKER_TOKEN: ${APP_WORKER_TOKEN:?Defina APP_WORKER_TOKEN no arquivo .env}
      WORKER_MAX_INTERACTIVE_SESSIONS: ${WORKER_MAX_INTERACTIVE_SESSIONS:-2}
      WORKER_MAX_SSE_SUBSCRIBERS_PER_SESSION: ${WORKER_MAX_SSE_SUBSCRIBERS_PER_SESSION:-3}
      APP_AUTOMATION_SESSION_SIGNING_SECRET: ${APP_AUTOMATION_SESSION_SIGNING_SECRET:?Defina APP_AUTOMATION_SESSION_SIGNING_SECRET no arquivo .env}
      FEDERAL_PORTAL_URL: ${FEDERAL_PORTAL_URL:-https://servicos.receitafederal.gov.br/servico/certidoes}
      FEDERAL_PORTAL_NAVIGATION_TIMEOUT_MS: ${FEDERAL_PORTAL_NAVIGATION_TIMEOUT_MS:-60000}
      FEDERAL_PORTAL_RESULT_TIMEOUT_MS: ${FEDERAL_PORTAL_RESULT_TIMEOUT_MS:-120000}
      SEFAZ_SP_PORTAL_URL: ${SEFAZ_SP_PORTAL_URL:-https://www10.fazenda.sp.gov.br/CertidaoNegativaDeb/Pages/EmissaoCertidaoNegativa.aspx}
      SEFAZ_SP_PORTAL_NAVIGATION_TIMEOUT_MS: ${SEFAZ_SP_PORTAL_NAVIGATION_TIMEOUT_MS:-60000}
      SEFAZ_SP_PORTAL_RESULT_TIMEOUT_MS: ${SEFAZ_SP_PORTAL_RESULT_TIMEOUT_MS:-120000}
      SEFAZ_SP_ENFORCE_SERVICE_WINDOW: ${SEFAZ_SP_ENFORCE_SERVICE_WINDOW:-true}
      PGE_SP_PORTAL_URL: ${PGE_SP_PORTAL_URL:-https://www.dividaativa.pge.sp.gov.br/sc/pages/crda/emitirCrda.jsf}
      PGE_SP_PORTAL_NAVIGATION_TIMEOUT_MS: ${PGE_SP_PORTAL_NAVIGATION_TIMEOUT_MS:-60000}
      PGE_SP_PORTAL_RESULT_TIMEOUT_MS: ${PGE_SP_PORTAL_RESULT_TIMEOUT_MS:-120000}
      SERPRO_CND_TOKEN_URL: ${SERPRO_CND_TOKEN_URL:-https://gateway.apiserpro.serpro.gov.br/token}
      SERPRO_CND_API_URL: ${SERPRO_CND_API_URL:-https://gateway.apiserpro.serpro.gov.br/consulta-cnd/v1/certidao}
      SERPRO_CND_CONSUMER_KEY: ${SERPRO_CND_CONSUMER_KEY:-}
      SERPRO_CND_CONSUMER_SECRET: ${SERPRO_CND_CONSUMER_SECRET:-}
      SERPRO_CND_STATIC_BEARER_TOKEN: ${SERPRO_CND_STATIC_BEARER_TOKEN:-}
      SERPRO_CND_ALLOW_STATIC_BEARER: ${SERPRO_CND_ALLOW_STATIC_BEARER:-false}
      SERPRO_CND_REQUEST_TAG: ${SERPRO_CND_REQUEST_TAG:-CONTABILIDADE}
      SERPRO_CND_HTTP_TIMEOUT_MS: ${SERPRO_CND_HTTP_TIMEOUT_MS:-30000}
      SERPRO_CND_PROCESSING_TIMEOUT_MS: ${SERPRO_CND_PROCESSING_TIMEOUT_MS:-120000}
      SERPRO_CND_POLL_INTERVAL_MS: ${SERPRO_CND_POLL_INTERVAL_MS:-750}
      SERPRO_CND_MAX_PDF_BYTES: ${SERPRO_CND_MAX_PDF_BYTES:-10485760}
      BROWSER_HEADLESS: "true"
      POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-180}
    shm_size: 1gb
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [contabilidade]

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      APP_API_BASE_URL: /api
      APP_AUTH_ENABLED: ${APP_SECURITY_ENABLED:-true}
      APP_KEYCLOAK_URL: /auth
      APP_KEYCLOAK_REALM: contabilidade
      APP_KEYCLOAK_CLIENT_ID: contabilidade-frontend
    ports:
      - "${APP_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [contabilidade]

networks:
  contabilidade:

volumes:
  postgres_data:
