map $http_x_forwarded_proto $contabilidade_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

map $http_x_forwarded_port $contabilidade_forwarded_port {
  default $http_x_forwarded_port;
  "" $server_port;
}

server {
  listen 8080;
  server_name _;

  client_max_body_size 27m;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $contabilidade_forwarded_proto;
    proxy_set_header X-Forwarded-Port $contabilidade_forwarded_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
  }

  location /automation/ {
    access_log off;
    proxy_pass http://automation-worker:3001/automation/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
    gzip off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 60s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $contabilidade_forwarded_proto;
    proxy_set_header X-Forwarded-Port $contabilidade_forwarded_port;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Rendered by 40-runtime-config.sh. In dev this file contains only a comment,
  # so Nginx has no dependency on the intentionally omitted Keycloak service.
  include /etc/nginx/contabilidade/auth-location.conf;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
