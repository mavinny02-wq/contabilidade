server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    min-response-size: 1KB
    mime-types:
      - application/json
      - application/problem+json
      - text/plain
      - text/html
      - text/css
      - application/javascript

spring:
  application:
    name: contabilidade-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/contabilidade}
    username: ${SPRING_DATASOURCE_USERNAME:contabilidade}
    password: ${SPRING_DATASOURCE_PASSWORD:contabilidade}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 27MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8088/auth/realms/contabilidade}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8088/auth/realms/contabilidade/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  environment: ${APP_ENVIRONMENT:LOCAL}
  version: ${APP_VERSION:0.3.0}
  security:
    enabled: ${APP_SECURITY_ENABLED:false}
    resource-client-id: ${APP_SECURITY_RESOURCE_CLIENT_ID:contabilidade-backend}
  storage:
    provider: local
    local-path: ${APP_STORAGE_LOCAL_PATH:./dados/documentos}
    max-file-size-bytes: ${APP_STORAGE_MAX_FILE_SIZE_BYTES:26214400}
  worker:
    token: ${APP_WORKER_TOKEN:token-local-altere}
  automation:
    session:
      public-path: ${APP_AUTOMATION_PUBLIC_PATH:/automation}
      signing-secret: ${APP_AUTOMATION_SESSION_SIGNING_SECRET:local-session-signing-secret-altere-1234567890}
      ticket-ttl: ${APP_AUTOMATION_SESSION_TICKET_TTL:PT15M}
  execution:
    recovery-interval-ms: ${APP_EXECUTION_RECOVERY_INTERVAL_MS:60000}
  certificate:
    scheduler-cron: ${APP_CERTIFICATE_SCHEDULER_CRON:0 15 6 * * *}
    alert-cron: ${APP_CERTIFICATE_ALERT_CRON:0 30 7 * * *}
