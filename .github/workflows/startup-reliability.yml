name: Startup Reliability

on:
  pull_request:
    branches: [main]
    paths:
      - START_CONTABILIDADE.bat
      - scripts/start-contabilidade-core.bat
      - scripts/start-contabilidade-resilient.ps1
      - scripts/start-compose-sequential.bat
      - scripts/start-compose-sequential.ps1
      - scripts/invoke-startup-runtime-preflight.ps1
      - scripts/verify-runtime-images.ps1
      - scripts/lib/contabilidade-docker.psm1
      - scripts/lib/startup-probe.psm1
      - scripts/lib/native-process.psm1
      - scripts/tests/**
      - scripts/codex/validate-docker-orchestration.mjs
      - scripts/codex/validate-docker-orchestration.test.mjs
      - .github/workflows/startup-reliability.yml
  workflow_dispatch:
    inputs:
      run_runtime:
        description: Execute Docker Desktop, Compose twice and the official BAT on a dedicated self-hosted Windows runner
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  windows-powershell51-contracts:
    name: Windows PowerShell 5.1 contracts
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Pester 5
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Run parser, guards, native stderr and mocked lifecycle tests
        shell: powershell
        run: |
          .\scripts\tests\run-startup-reliability-gate.ps1

  windows-docker-desktop-runtime:
    name: Windows Docker Desktop runtime gate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_runtime }}
    runs-on: [self-hosted, Windows, X64, docker-desktop, contabilidade-startup]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Pester 5
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Run full startup reliability gate
        shell: powershell
        run: |
          .\scripts\tests\run-startup-reliability-gate.ps1 `
            -RunDockerIntegration `
            -RunComposeIntegration `
            -RunOfficialStartup
