name: Secret lifecycle guard

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Parse schema, policy, fixtures, and inventory
        run: |
          python -m json.tool scripts/security/secret-lifecycle/schema.json >/dev/null
          python -m json.tool scripts/security/secret-lifecycle/policy.json >/dev/null
          find scripts/security/secret-lifecycle -name '*.json' -print0 | sort -z | xargs -0 -n1 python -m json.tool >/dev/null
      - name: Validate lifecycle and redaction fixtures
        run: python -m unittest discover -s scripts/security/secret-lifecycle/tests -p 'test_*.py'
      - name: Generate deterministic redacted inventory twice
        run: |
          python scripts/security/secret-lifecycle/secret_lifecycle_guard.py --output /tmp/inventory-first.json
          python scripts/security/secret-lifecycle/secret_lifecycle_guard.py --output /tmp/inventory-second.json
          cmp /tmp/inventory-first.json /tmp/inventory-second.json
      - name: Run lifecycle guard
        run: python scripts/security/secret-lifecycle/secret_lifecycle_guard.py
