services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: local
      APP_SECURITY_ENABLED: "false"
    depends_on: !override
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    environment:
      APP_AUTH_ENABLED: "false"
    depends_on: !override
      backend:
        condition: service_healthy

  automation-worker:
    environment:
      WORKER_SHUTDOWN_GRACE_PERIOD_MS: ${WORKER_SHUTDOWN_GRACE_PERIOD_MS:-120000}
      WORKER_SHUTDOWN_SERVER_CLOSE_TIMEOUT_MS: ${WORKER_SHUTDOWN_SERVER_CLOSE_TIMEOUT_MS:-10000}
    stop_grace_period: ${WORKER_SHUTDOWN_STOP_GRACE_PERIOD:-130s}
    ports:
      - "3001:3001"
