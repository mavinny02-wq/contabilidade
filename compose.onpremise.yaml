services:
  keycloak:
    command:
      - start
      - --import-realm
      - --http-enabled=true
      - --http-relative-path=/auth
      - --proxy-headers=xforwarded
      - --hostname-strict=false

  postgres:
    ports: []

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: onpremise

  frontend:
    restart: always

  automation-worker:
    restart: always
    environment:
      WORKER_SHUTDOWN_GRACE_PERIOD_MS: ${WORKER_SHUTDOWN_GRACE_PERIOD_MS:-120000}
      WORKER_SHUTDOWN_SERVER_CLOSE_TIMEOUT_MS: ${WORKER_SHUTDOWN_SERVER_CLOSE_TIMEOUT_MS:-10000}
    stop_grace_period: ${WORKER_SHUTDOWN_STOP_GRACE_PERIOD:-130s}
