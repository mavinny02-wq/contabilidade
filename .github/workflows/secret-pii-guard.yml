name: Secret and PII guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files
        run: python3 scripts/security/secret_pii_guard.py
      - name: Run synthetic guard tests
        run: python3 scripts/security/test_secret_pii_guard.py
