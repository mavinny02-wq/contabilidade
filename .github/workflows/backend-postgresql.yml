name: Backend PostgreSQL 17

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-postgresql.yml"

jobs:
  flyway-jpa-postgresql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verificar Docker
        run: docker info
      - name: Validar Flyway, idempotência e JPA no PostgreSQL 17
        working-directory: backend
        run: mvn -B clean verify -Dtest=BancoPostgresqlIntegracaoTest -Dsurefire.failIfNoSpecifiedTests=true
